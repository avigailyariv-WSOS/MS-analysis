name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Change this to 'master' if your main branch is called master
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://AvigailYariv:$HF_TOKEN@huggingface.co/spaces/AvigailYariv/Mass-Spec-AUC main